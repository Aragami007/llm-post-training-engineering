name: Validate curriculum and tracker
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and rendered issue files
        run: python3 scripts/validate_course.py
      - name: Run standard-library tests
        run: python3 -m unittest discover -s tests -v
