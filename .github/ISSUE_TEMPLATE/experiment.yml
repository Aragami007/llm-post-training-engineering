name: Extra research experiment
description: Track a new experiment outside the 133-course-topic baseline
labels: [kind:experiment]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Falsifiable hypothesis
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Frozen eval, controlled variables, baseline and failure criteria
    validations:
      required: true
  - type: textarea
    id: compute
    attributes:
      label: Data/model/checkpoint versions, compute and cost gate
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Planned results, evidence, and stop criteria
